name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install prerequisites & Android SDK command-line tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y wget unzip zip unzip openjdk-17-jdk-headless curl git
          export ANDROID_SDK_ROOT=$HOME/Android/Sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          # sdkmanager may be under different nested folder depending on zip layout
          if [ -f "$ANDROID_SDK_ROOT/cmdline-tools/tools/bin/sdkmanager" ]; then
            SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/tools/bin/sdkmanager
          else
            SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin/sdkmanager
          fi
          yes | $SDKMANAGER --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

      - name: Install system Gradle (fallback)
        run: |
          sudo apt-get install -y gradle

      - name: Debug environment info
        run: |
          echo "=== PATH ==="
          echo $PATH
          echo "=== Java version ==="
          java -version || true
          echo "=== Gradle version (system) ==="
          gradle -v || true
          echo "=== Check for gradlew ==="
          ls -la || true
          if [ -f "./gradlew" ]; then
            echo "gradlew exists"
            chmod +x ./gradlew
          else
            echo "gradlew not found"
          fi
          echo "=== ANDROID_SDK_ROOT ==="
          echo $ANDROID_SDK_ROOT
          echo "=== Files in project root ==="
          ls -la

      - name: Ensure Gradle wrapper (if missing)
        run: |
          set -e
          if [ ! -f "./gradlew" ]; then
            echo "Generating Gradle wrapper using system gradle..."
            gradle wrapper --gradle-version 8.4 --no-daemon || (echo "gradle wrapper failed" && exit 0)
            chmod +x ./gradlew || true
          fi
        continue-on-error: false

      - name: Build debug APK (try wrapper, then system gradle)
        env:
          ANDROID_SDK_ROOT: $HOME/Android/Sdk
          ANDROID_HOME: $HOME/Android/Sdk
        run: |
          set -e
          echo "Running build (prefer ./gradlew)..."
          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "gradlew not available, trying system gradle"
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK(s)
        run: |
          echo "Searching for APK outputs..."
          find . -type f -path "*/app/build/outputs/apk/debug/*.apk" -print || true
          find . -type f -path "*/build/outputs/apk/debug/*.apk" -print || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meddash-app-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
