name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Android SDK command-line tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y wget unzip
          export ANDROID_SDK_ROOT=$HOME/Android/Sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          # sdkmanager location differs between zip layouts
          if [ -f "$ANDROID_SDK_ROOT/cmdline-tools/tools/bin/sdkmanager" ]; then
            SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/tools/bin/sdkmanager
          else
            SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin/sdkmanager
          fi
          yes | $SDKMANAGER --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Install Gradle
        run: sudo apt-get install -y gradle

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: $HOME/Android/Sdk
          ANDROID_HOME: $HOME/Android/Sdk
        run: |
          set -e
          java -version
          gradle -v
          ls -la
          ./gradlew assembleDebug || gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meddash-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
